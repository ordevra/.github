name: Task
description: A piece of work that someone can pick up and finish.
title: "task: "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, and why it matters now.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: Checkable conditions. A reviewer should be able to confirm each one.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and reading order
      description: Documents, pull requests or issues to read first, so the task can be picked up cold.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this task deliberately does not change.
  - type: checkboxes
    id: data-check
    attributes:
      label: Data check
      options:
        - label: This issue contains no secrets, credentials, personal data or client data.
          required: true
